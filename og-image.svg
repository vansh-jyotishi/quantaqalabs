<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter Tight, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1a2438" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(80,80)">
    <rect x="0" y="0" width="56" height="56" rx="10" fill="#050810" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="28" y="40" font-family="JetBrains Mono, ui-monospace, monospace" font-size="32" font-weight="700" text-anchor="middle" fill="#22d3ee">Q</text>
    <rect x="44" y="44" width="10" height="10" rx="2" fill="#22d3ee"/>
    <text x="78" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="700" fill="#e8eef7">QUANTA</text>
    <text x="170" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" font-weight="400" fill="#7a8aa3">QA LABS</text>
    <text x="78" y="50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#7a8aa3" letter-spacing="2">PRECISION TESTING / QUALITY ASSURED</text>
  </g>

  <g transform="translate(80,260)">
    <text font-family="Inter Tight, sans-serif" font-size="74" font-weight="600" fill="#e8eef7" letter-spacing="-2">
      <tspan x="0" y="0">Quality Engineering</tspan>
      <tspan x="0" y="86">at <tspan fill="#22d3ee">Quantum</tspan> Precision</tspan>
    </text>
  </g>

  <g transform="translate(80,485)">
    <text font-family="Inter Tight, sans-serif" font-size="22" fill="#bcc8dc">QA consultants &amp; automation engineers — Playwright, Cypress, CI/CD, AI testing.</text>
    <text x="0" y="42" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#7a8aa3" letter-spacing="2">12+ YEARS  ·  50+ PROJECTS  ·  99.9% TEST COVERAGE</text>
  </g>

  <g transform="translate(80,580)" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16">
    <circle cx="6" cy="-5" r="6" fill="#a3e635"/>
    <text x="20" y="0" fill="#a3e635">quantaqalabs.com</text>
  </g>
</svg>
